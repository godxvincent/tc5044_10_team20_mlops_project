default:
# Podemos agregar cualquier configuracion general en esta sección
  external_api:
    server: "database_server"
    port: "8080"
  mlconfig:
    general:
      random_state: 42
# Configuracion local
local:
  mlconfig:
    mlflowconfig:
      server: "localhost"
      port: "8080"
      experiment_name: "Turkish Music Emotion Classification"
      enabled: true
      databricks: false
    databricks:
      host: ""
      uri: ""
      experiment_folder: ""
    logger:
      log_level : "INFO"
      log_format : "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      log_date_format : "%Y-%m-%d %H:%M:%S"
      log_stream : "stdout"
    data_loader:
      test_size: 0.3
      outlier_k: 3
    model_trainer:
      iterations: 30
      cv_folds: 5                   
      scoring: "accuracy"               
      verbose: 0
    feature_engine:
      k_features: 15 
      n_components: 8
      n_components_f: 0.95

                  
# Configuracion del ambiente de pruebas


