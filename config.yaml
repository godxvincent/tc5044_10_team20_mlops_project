default:
# Podemos agregar cualquier configuracion general en esta sección
  external_api:
    server: "database_server"
    port: "8080"
local:
  mlconfig:
    mlflowconfig:
      server: "localhost"
      port: "5000"
    logger:
      log_level : "DEBUG"
      log_format : "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      log_date_format : "%Y-%m-%d %H:%M:%S"
      log_stream : "stdout"
    data_loader:
      test_data_percentage: 0.2


