services:

  postgres-server:
    image: postgres:15
    container_name: postgres-server
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpwd
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio-server:
    image: minio/minio
    container_name: minio-server
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio-server
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio-server:9000 admin password123 && mc mb -p local/mlflow || true && mc anonymous set public local/mlflow || true "

  mlflow-server:
    build:
      context: ./mlflow_server
      dockerfile: Dockerfile
    container_name: mlflow-server
    environment:
      BACKEND_STORE_URI: postgresql://mlflow:mlflowpwd@postgres-server:5432/mlflowdb
      ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      MLFLOW_S3_ENDPOINT_URL: http://minio-server:9000
    ports:
      - "5000:5000"
    depends_on:
      - postgres-server
      - minio-server
      - minio-create-bucket

  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-service
    environment:
      MODEL_URI: models:/turkish_music_emotion_rf/1
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    ports:
      - "8000:8000"
    depends_on:
      - mlflow-server

volumes:
  pgdata:
  minio_data:
