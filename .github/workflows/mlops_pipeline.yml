name: GitHub Actions Demo
run-name: ${{ github.actor }} triggered this workflow from ${{ github.ref_name }} 🚀
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 event type ${{ github.event.action }} event."
      - run: echo "🎉 event name ${{ github.action }} event."
      - run: echo "🎉 event merged flag ${{ github.event.pull_request.merged }} ."
      - run: echo "🎉 event merged at ${{ github.event.pull_request.merged_at }} ."
      - run: echo "🎉 action ${{ github.action }} event."
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - uses: actions/setup-python@v6
        with:
           python-version: '3.13'
           cache: 'pip'
      - name: install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      # BLACK - Verifica el formato del código (no modifica, solo revisa)
      - name: Check code format with Black
        run: black --check --line-length=120 .

      # ISORT - Verifica el orden correcto de imports
      - name: Check import order with isort
        run: isort --check-only --profile=black --line-length=120 .

      # FLAKE8 - Busca errores de estilo, sintaxis y patrones inseguros
      - name: Run Flake8
        run: flake8 .
      
      - name: Download files from dvc
        run: |
            export GDRIVE_CREDENTIALS_DATA='${{ secrets.DVC_GDRIVE_CREDENTIALS_DATA }}'
            dvc remote modify --local ${{ vars.DVC_REMOTE_DATASET }} gdrive_use_service_account true
            dvc pull -r ${{ vars.DVC_REMOTE_DATASET }}
            echo "Listing dvc directory to confirm data was pulled correctly"
            ls -lrtaR ${{ github.workspace }}/data

      - name: Test with pytest
        run: |
          pytest ./tests 
      - name: Archive xml files for code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-xml
          path: coverage.xml
          retention-days: 5
      - name: Archive html files for code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-html
          path: ./htmlcov/**
          retention-days: 5
      - run: echo "🍏 This job's status is ${{ job.status }}."
  integration-tests:
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - uses: actions/setup-python@v6
        with:
           python-version: '3.13'
           cache: 'pip'
      - name: install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Download files from dvc
        run: |
            export GDRIVE_CREDENTIALS_DATA='${{ secrets.DVC_GDRIVE_CREDENTIALS_DATA }}'
            dvc remote modify --local ${{ vars.DVC_REMOTE_DATASET }} gdrive_use_service_account true
            dvc pull -r ${{ vars.DVC_REMOTE_DATASET }}
            echo "Listing dvc directory to confirm data was pulled correctly"
            ls -lrtaR ${{ github.workspace }}/data
      - name: Test with pytest
        run: |
          pytest ./integration_tests
      - name: Archive xml files for code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: integration-code-coverage-report-xml
          path: coverage.xml
          retention-days: 5
      - name: Archive html files for code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: integration-code-coverage-report-html
          path: ./htmlcov/**
          retention-days: 5
      - run: echo "🍏 This job's status is ${{ job.status }}."
      - run: echo "🍏 This the merge status ${{ github.event.pull_request.merged }}."
  # build:
  #   needs: validate-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: |
  #         echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
  #         echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
  #         echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
  #     - name: Check out repository code
  #       uses: actions/checkout@v5
  #     - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
  #     - uses: actions/setup-python@v6
  #       with:
  #          python-version: '3.13'
  #     - name: install dependencies
  #       run: |
  #           python -m pip install --upgrade pip
  #           pip install -r requirements.txt
  publish:
    # needs: build
    needs: integration-tests
    if:  ${{ github.event.pull_request.merged == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - uses: actions/setup-python@v6
        with:
           python-version: '3.13'
      - name: install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - name: Download files from dvc
        run: |
            export GDRIVE_CREDENTIALS_DATA='${{ secrets.DVC_GDRIVE_CREDENTIALS_DATA }}'
            dvc remote modify --local ${{ vars.DVC_REMOTE_DATASET }} gdrive_use_service_account true
            dvc pull -r ${{ vars.DVC_REMOTE_DATASET }}
            echo "Listing dvc directory to confirm data was pulled correctly"
            ls -lrtaR ${{ github.workspace }}/data
      - name: "Publishing model to mlflow"
        run: |
          export PYTHONPATH=$(pwd)
          export MLOPS_MLCONFIG__DATABRICKS__client_id=${{ secrets.MLOPS_MLCONFIG__DATABRICKS__CLIENT_ID }}
          export MLOPS_MLCONFIG__DATABRICKS__client_secret=${{ secrets.MLOPS_MLCONFIG__DATABRICKS__CLIENT_SECRET }}
          export ENV_FOR_DYNACONF=${{ vars.CICD_ENV_FOR_DYNACONF }}
          python ./mlops/publisher/pipeline.py
          
          

