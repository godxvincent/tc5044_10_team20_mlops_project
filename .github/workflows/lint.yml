# --------------------------------------------------------------
# Workflow: Lint
# --------------------------------------------------------------
# 📌 Este workflow se ejecuta automáticamente en cada push o pull request.
# Verifica el estilo y la calidad del código antes de que se fusione.
# Utiliza Black, isort y Flake8 para mantener el código limpio y consistente.
# --------------------------------------------------------------

name: Lint

# EVENTOS QUE DISPARAN EL WORKFLOW
# Este flujo de trabajo se ejecuta en cada 'push' o 'pull_request' al repositorio.
on: [push, pull_request]

jobs:
  lint:
    # SISTEMA DONDE CORRE
    # Usa un entorno Linux limpio con Python preinstalado.
    runs-on: ubuntu-latest

    steps:
      # DESCARGA EL CÓDIGO DEL REPOSITORIO
      - name: Checkout repository
        uses: actions/checkout@v4

      # CONFIGURA LA VERSIÓN DE PYTHON
      # Instala Python en el runner para ejecutar los linters.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # INSTALA LAS DEPENDENCIAS NECESARIAS PARA LOS CHEQUEOS
      # Incluye Black (formateo), isort (orden de imports) y Flake8 (linting).
      # 'flake8-bugbear' añade reglas adicionales de buenas prácticas.
      - name: Install linting dependencies
        run: |
          pip install black isort flake8 flake8-bugbear

      # BLACK - Verifica el formato del código (no modifica, solo revisa)
      - name: Check code format with Black
        run: black --check --line-length=150 .

      # ISORT - Verifica el orden correcto de imports
      - name: Check import order with isort
        run: isort --check-only --profile=black --line-length=150 .

      # FLAKE8 - Busca errores de estilo, sintaxis y patrones inseguros
      - name: Run Flake8
        run: flake8 .
