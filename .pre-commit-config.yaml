# .pre-commit-config.yaml
repos:
  # 1) Black: formatea código
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        args: ["--line-length=120"]

  # 2) isort: ordena imports (compatible con Black)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  # 3) Flake8: linting (con bugbear)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear

  # 4) nbstripout: limpia metadatos de notebooks (opcional)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # 5) Hook local: genera TXT con Black/Flake8 (timestamp_usuario_rama)
  - repo: local
    hooks:
      - id: save-lint-reports
        name: Save lint reports (Black & Flake8) to tools/lint_reports
        entry: python tools/run_linters_and_save_reports.py --check --verbose
        language: python
        additional_dependencies:
          - black==25.9.0
          - flake8==7.1.1
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
