[flake8]
# Máximo de caracteres por línea
max-line-length = 150

# Ignorar errores específicos --Agregar aqui
ignore = 
    E203
    W503

# Excluir carpetas o archivos (por ejemplo: entorno virtual y migraciones)
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    migrations

# Mostrar código de error junto con el mensaje
show-source = true

# Reportar complejidad ciclomatica (opcional)
max-complexity = 10

# Seleccionar qué tipos de errores revisar
select = B,C,E,F,W,T4,B9