version: "3.7"
services:
  mlflow:
    build:
      context: mlflow_server
      dockerfile: Dockerfile
    image: mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000 
      MLFLOW_BACKEND_STORE_URI: postgresql://user:password@postgres:5432/mlflowdb
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio_user 
      AWS_SECRET_ACCESS_KEY: minio_password
    command: mlflow server --backend-store-uri 'postgresql://user:password@postgres:5432/mlflowdb' --default-artifact-root 's3://bucket/' --host 0.0.0.0 --port 5000
    depends_on:
      - postgres
      - minio
    ports:
      - "5000:5000"
    volumes:
      - ${HOME}/mlruns:/mlflow
    restart: always
  # PostgreSQL database
  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlflowdb
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
  # MinIO server
  minio:
    image: minio/minio
    expose:
      - "9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minio_user"
      MINIO_ROOT_PASSWORD: "minio_password"
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    command: server /data --console-address ":9001"
  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      bash -c "
      mc alias set minio http://minio:9000 minio_user minio_password &&
      if ! mc ls minio/bucket; then
        mc mb minio/bucket
      else
        echo 'bucket already exists'
      fi
      "